name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datatalk_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: datatalk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datatalk_owner -d datatalk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway CI database; these are not real credentials.
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://datatalk_owner:ci_owner_password@localhost:5432/datatalk_test
      TEST_DATABASE_URL: postgresql+psycopg://datatalk_test_reader:ci_reader_password@localhost:5432/datatalk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Demo mode never shows a wrong answer
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m app.evaluation --out /tmp/eval.json
          python -c "import json; s = json.load(open('/tmp/eval.json'))['summary']; assert s['wrong_answer_rate'] == 0 and s['decline_accuracy'] == 1, s"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
